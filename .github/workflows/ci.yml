name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python 3.9 TOML support
        if: matrix.python-version == '3.9'
        run: python -m pip install tomli
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke CLI
        run: |
          zotero-librarian --help
          zotero-librarian --json doctor --offline
          zotero-librarian --json schema plan
      - name: Lint YAML
        run: |
          python -m pip install yamllint
          yamllint .github/workflows/ci.yml .github/workflows/release.yml skills/zotero-librarian/agents/openai.yaml
      - name: Validate examples
        run: |
          python skills/zotero-librarian/scripts/librarian_guard.py taxonomy taxonomy.example.toml
          python skills/zotero-librarian/scripts/librarian_guard.py plan examples/edits.example.jsonl --taxonomy taxonomy.example.toml
      - name: Validate skill
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/main/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/quick_validate.py
          python /tmp/quick_validate.py skills/zotero-librarian
      - name: Build package
        run: |
          python -m pip install build
          python -m build

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
